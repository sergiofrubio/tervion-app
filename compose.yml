services:
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app-network
    depends_on:
      - apache

  apache:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    expose:
      - "80"
    env_file:
      - .env
    environment:
      APP_ENV: production
      DB_HOST: db
      DB_NAME: app
      DB_USER: root
      DB_PASS: root
    networks:
      - app-network
    depends_on:
      - db
    restart: always

  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: app
    volumes:
      - db_data:/var/lib/mysql
      - ./data/app.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network
    restart: always

volumes:
  db_data:
  caddy_data:
  caddy_config:

networks:
  app-network:
    driver: bridge

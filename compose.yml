services:
  caddy:
    image: caddy:2-alpine
    restart: always
    expose:
      - "80"
      - "443"
      - "443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./public:/var/www/html/public:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - php
    networks:
      - proxy

  php:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    expose:
      - "9000"
    env_file:
      - .env
    environment:
      APP_ENV: production
      DB_HOST: db
      DB_NAME: app
      DB_USER: root
      DB_PASS: root
    depends_on:
      - db
    restart: always

  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: app
    volumes:
      - db_data:/var/lib/mysql
      - ./data/app.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always

volumes:
  db_data:
  caddy_data:
  caddy_config:

networks:
  proxy:
    external: true

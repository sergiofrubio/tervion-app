name: Despliegue en Servidor Local

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Crear archivo .env desde Secrets
        run: |
          echo "${{ secrets.ENV_PRODUCTION }}" > .env

      - name: Construir y desplegar contenedores
        run: |
          # 1. Construir aprovechando la caché local del runner/host (sin --no-cache)
          docker compose -f compose.yml -f compose.prod.yml build
          
          # 2. Desplegar en caliente (solo recrea contenedores que han cambiado, sin downtime previo)
          docker compose -f compose.yml -f compose.prod.yml up -d --remove-orphans
